<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MakeMyTrip - Flight, Hotel, Train, Bus Booking & Holiday Packages</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(event) {
        var errorDiv = document.getElementById('debug-error-box');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'debug-error-box';
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.background = '#fee2e2';
          errorDiv.style.color = '#ef4444';
          errorDiv.style.padding = '20px';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.fontSize = '14px';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.whiteSpace = 'pre-wrap';
          document.body.appendChild(errorDiv);
        }
        errorDiv.innerHTML = '<strong>Error caught:</strong><br>' + event.message + '<br>at ' + event.filename + ':' + event.lineno + ':' + event.colno + '<br><br>Stack Trace:<br>' + (event.error ? event.error.stack : 'N/A');
      });
      window.addEventListener('unhandledrejection', function(event) {
        var errorDiv = document.getElementById('debug-error-box');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'debug-error-box';
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.background = '#fee2e2';
          errorDiv.style.color = '#ef4444';
          errorDiv.style.padding = '20px';
          errorDiv.style.zIndex = '999999';
          errorDiv.style.fontSize = '14px';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.whiteSpace = 'pre-wrap';
          document.body.appendChild(errorDiv);
        }
        errorDiv.innerHTML = '<strong>Unhandled Promise Rejection:</strong><br>' + event.reason + '<br><br>Stack Trace:<br>' + (event.reason && event.reason.stack ? event.reason.stack : 'N/A');
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
